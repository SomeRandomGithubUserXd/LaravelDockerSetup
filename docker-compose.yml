# --- anchors: reusable blocks, compose ignores top-level keys starting with x- ---

x-logging: &logging
  logging:
    options: { max-size: "10m", max-file: "3" }   # docker logs: max 3 files x 10 MB per container

x-env: &env
  APP_NAME: ${APP_NAME}
  APP_ENV: ${APP_ENV}
  APP_DEBUG: ${APP_DEBUG}
  APP_URL: ${APP_URL}
  DB_HOST: mysql
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD}

x-laravel: &laravel                 # everything that runs our laravel image
  <<: *logging
  build:
    context: ./app
    args:
      APP_UID: ${APP_UID:?no .env file, run ./init.sh before build}
  restart: always
  env_file: ./app/.env
  environment: *env
  volumes:
    - storage:/var/www/html/storage
  depends_on: [ app ]

services:
  app:
    <<: *laravel
    depends_on:                       # replaces depends_on from anchor (app can't depend on itself)
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *laravel
    command: php artisan queue:work --tries=3 --timeout=300 --max-time=3600
    stop_grace_period: 5m             # let current job finish on deploy

  scheduler:
    <<: *laravel
    command: php artisan schedule:work

  web:
    <<: *logging
    build:
      context: ./web
      additional_contexts:
        app: service:app
    restart: always
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - storage:/var/www/html/storage:ro
      - caddy_data:/data
    depends_on: [ app ]

  mysql:
    <<: *logging
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

  redis:
    <<: *logging
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backup:
    <<: *logging
    build: ./backup
    profiles: [ backup ]
    restart: always
    environment:
      DB_DATABASE: ${DB_DATABASE}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      S3_PATH: ${S3_PATH}
      PING_URL: ${BACKUP_PING_URL:-}
      # rclone reads its config from env: remote named "s3"
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: Other
      RCLONE_CONFIG_S3_ENDPOINT: https://s3.twcstorage.ru
      RCLONE_CONFIG_S3_REGION: ru-1
      RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage:/storage:ro
    depends_on:
      mysql: { condition: service_healthy }

volumes:
  caddy_data:
  mysql:
  redis:
  storage: